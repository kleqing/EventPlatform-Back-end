name: Build, publish and deploy to MonsterASP.NET
on: [push]

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0
          
      - name: Install dependencies
        run: dotnet restore ./EventPlatform.WebApi/EventPlatform.WebApi.csproj --runtime win-x86
        
      - name: Build
        run: dotnet build ./EventPlatform.WebApi/EventPlatform.WebApi.csproj --configuration Release --runtime win-x86 --no-restore

      - name: Publish
        run: dotnet publish ./EventPlatform.WebApi/EventPlatform.WebApi.csproj --configuration Release --output ./publish --runtime win-x86 --no-build

      - name: Check publish directory
        run: dir ./publish
        
      - name: Test with .NET
        run: dotnet test

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: ./publish
